name: Keep API awake

# Render's free tier puts the service to sleep after ~15 minutes idle, and the
# cold start that follows is slow enough to time out a login. Pinging /health
# every 10 minutes keeps the instance warm. This repo is public, so the Actions
# minutes are free.
#
# Setup: add a repository secret named API_URL with the Render base URL
# (Settings -> Secrets and variables -> Actions), e.g.
#   https://newtownsociety-backend.onrender.com
#
# Note: GitHub disables scheduled workflows after 60 days with no commits to
# the repo — push anything, or hit "Run workflow", to re-enable.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL secret is not set — nothing to ping."
            exit 0
          fi

          curl -sS --max-time 120 --retry 2 --retry-all-errors \
            -o /dev/null -w "health responded %{http_code} in %{time_total}s\n" \
            "${API_URL%/}/health"
